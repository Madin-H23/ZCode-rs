# 仓库内所有 Rust workspace 共用的 clippy 配置；clippy 会从 crate 目录向上找到这个文件。
# 规则来源：docs/specs/rust-engineering-practices.md §2.2。

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# tokio 的锁 guard 跨 .await 持有时，其他任务会一直等待；std 的 guard 由 await_holding_lock 覆盖。
# 存量位置标注了 `#[expect(clippy::await_holding_invalid_type, reason = "存量，U2 改为 actor")]`：
# 在 U2 改为 actor 或缩小临界区后删除（docs/specs/rust-unified-host.md 第 12 节）。
await-holding-invalid-types = [
  "tokio::sync::MutexGuard",
  "tokio::sync::OwnedMutexGuard",
  "tokio::sync::RwLockReadGuard",
  "tokio::sync::RwLockWriteGuard",
]

# 子进程的唯一入口（docs/specs/rust-u0-foundation.md §3.5）：只有 zcode-proc 可以直接创建 Command，
# U1 起在那里注入运行时环境。测试同样经 zcode-proc 创建子进程。
disallowed-methods = [
  { path = "std::process::Command::new", reason = "use zcode_proc::std_command (rust/crates/proc, spec rust-u0-foundation §3.5)" },
  { path = "tokio::process::Command::new", reason = "use zcode_proc::command (rust/crates/proc, spec rust-u0-foundation §3.5)" },
]
