# 基础 crate（docs/specs/rust-u0-foundation.md §3）。不依赖任何应用 crate；
# apps/zcode-cli-rust 与 apps/zcode-host 通过路径依赖使用。应用 crate 在 U1 前迁入本 workspace。
[workspace]
members = ["crates/kit", "crates/async", "crates/proc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# 规则来源：docs/specs/rust-engineering-practices.md §2.1；三个 Rust workspace 保持同一份列表。
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_collect = "deny"
needless_question_mark = "deny"
# stdio 是协议通道（Host ↔ CLI、Main ↔ Host），任何打印都会破坏帧；测试中由 clippy.toml 放行。
print_stderr = "deny"
print_stdout = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_to_owned = "deny"
# 新代码从第一天起不允许 unwrap / expect（测试由 clippy.toml 放行），每个 unsafe 块都要写 SAFETY 说明。
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[workspace.dependencies]
# 只列出已使用的依赖（cargo-shear 会拒绝未使用的 workspace 依赖）。
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
# 只用门面宏；订阅者由应用安装（同 apps/zcode-cli-rust）。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# zcode-proc 的 Job Object（与两个应用 workspace 同一主版本）。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
