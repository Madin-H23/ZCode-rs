# Rust Host（docs/specs/rust-host.md）。独立 workspace：只通过路径依赖引用 CLI 的协议 crate，
# 不链接 CLI runtime，保证“CLI 是独立进程”在编译期成立。
[workspace]
members = [
  "crates/rpc",
  "crates/control",
  "crates/kit",
  "crates/services",
  "crates/host-core",
  "crates/zcode-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
print_stdout = "deny"

[workspace.dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
libc = "0.2"
regex = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
zcode-cli-domain = { path = "../zcode-cli-rust/crates/domain" }
zcode-host-control = { path = "crates/control" }
zcode-host-core = { path = "crates/host-core" }
zcode-host-kit = { path = "crates/kit" }
zcode-host-services = { path = "crates/services" }
zcode-host-rpc = { path = "crates/rpc" }

[profile.release]
lto = "thin"
strip = true
