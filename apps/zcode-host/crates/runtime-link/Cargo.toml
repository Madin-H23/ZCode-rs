[package]
name = "zcode-host-runtime-link"
description = "The Host's only link to the agent runtime: selection, child-process and in-process transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# 进程内 runtime（docs/specs/rust-host-cli-boundary.md §3.3）：链接 CLI 的顶层 crate。不开时只有子进程链路，
# 不链接任何 CLI 代码。
embedded = ["dep:zcode-cli-rust", "dep:tokio-util"]

[dependencies]
anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, optional = true }
zcode-cli-rust = { workspace = true, optional = true }
zcode-host-kit.workspace = true
zcode-proc.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lib]
doctest = false
