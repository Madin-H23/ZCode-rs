[package]
name = "zcode-host-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zcode-host-base.workspace = true
zcode-host-settings.workspace = true
zcode-host-providers.workspace = true
zcode-host-sessions.workspace = true
zcode-host-account.workspace = true
zcode-host-extensions.workspace = true
zcode-host-workspace.workspace = true
zcode-host-automation.workspace = true
zcode-host-remote.workspace = true
serde_json.workspace = true
tokio.workspace = true
zcode-host-control.workspace = true
zcode-host-kit.workspace = true

[dev-dependencies]
tempfile = "3"
base64.workspace = true
futures-util.workspace = true
zcode-host-rpc.workspace = true
# 集成测试缺省走进程内 runtime（docs/specs/rust-host-cli-boundary.md §3.3）：只为打开 feature，代码里不引用。
zcode-host-runtime-link = { workspace = true, features = ["embedded"] }
zcode-proc.workspace = true

[package.metadata.cargo-shear]
# zcode-host-runtime-link 只用于给测试打开 feature `embedded`（见上）。
ignored = ["zcode-host-runtime-link"]

[lib]
doctest = false
test = false
